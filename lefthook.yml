pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "apps/api/**/*.go"
      run: gofmt -l -w {staged_files}
      stage_fixed: true

    golangci-lint:
      glob: "apps/api/**/*.go"
      run: cd apps/api && golangci-lint run ./...

    eslint:
      glob: "apps/web/**/*.{ts,vue}"
      run: cd apps/web && npx eslint --fix $(echo "{staged_files}" | tr ' ' '\n' | sed 's|apps/web/||g' | tr '\n' ' ')
      stage_fixed: true

    prettier:
      glob: "**/*.{ts,vue,json,md}"
      exclude: "pnpm-lock.yaml"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
