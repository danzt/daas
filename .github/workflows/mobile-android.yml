name: Mobile — Android APK

# Compila el APK de Android (Capacitor) y lo sube a un Release de GitHub.
# - Push de un tag v* (ej: v1.0.0) → buildea y adjunta el APK al Release del tag.
# - Ejecución manual (workflow_dispatch) → buildea y deja el APK como artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # Capacitor 8 (AGP 8) requiere JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Genera el SPA estático con la URL del backend horneada en el bundle.
      - name: Build static web (Capacitor)
        run: pnpm exec nuxt generate
        env:
          NUXT_CAPACITOR: 'true'
          NUXT_PUBLIC_API_BASE: https://daas-l36f.onrender.com

      # android/ no está en el repo: se scaffolda efímero desde capacitor.config.ts.
      - name: Scaffold + sync Android
        run: |
          npx cap add android
          npx cap sync android

      # ponytail: APK debug = instalable en cualquier device sin secrets de firma.
      # Para release firmado (Play Store) hace falta un keystore en secrets + assembleRelease.
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: apps/web/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daas-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
