version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/adapter/postgres/sqlc/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "sqlcdb"
        out: "internal/adapter/postgres/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
